# Yazi behavior config for this dotfiles repo.

[opener]
edit = [
	{ run = "nvim %s", block = true, desc = "Neovim", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "text/*", use = "edit" },
	{ url = "*.md", use = "edit" },
	{ url = "*.markdown", use = "edit" },
	{ url = "*.txt", use = "edit" },
	{ url = "*.lua", use = "edit" },
	{ url = "*.vim", use = "edit" },
	{ url = "*.sh", use = "edit" },
	{ url = "*.zsh", use = "edit" },
	{ url = "*.toml", use = "edit" },
	{ url = "*.yaml", use = "edit" },
	{ url = "*.yml", use = "edit" },
	{ url = "*.json", use = "edit" },
]
