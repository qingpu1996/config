# Yazi keybindings translated for the Norman layout.
#
# Navigation mirrors the Neovim Norman layer in this repo:
#   y = left, n = down, i = up, o = right
#
# Action keys follow the same QWERTY -> Norman migration used in
# nvim/lua/config/norman.lua and lazygit/config.yml.  Keys that don't
# conflict with Norman navigation are left at their defaults.
#
# We use prepend_keymap so unchanged defaults still work.  Where a Norman
# navigation key shadows a default action, we noop the old binding and
# re-assign the action to its Norman-translated key.

# ── [mgr] ─────────────────────────────────────────────────────────────

[mgr]

prepend_keymap = [
	# ── Navigation (hjkl → ynio) ──
	{ on = "i", run = "arrow prev",  desc = "Previous file" },
	{ on = "n", run = "arrow next",  desc = "Next file" },
	{ on = "y", run = "leave",       desc = "Back to the parent directory" },
	{ on = "o", run = "enter",       desc = "Enter the child directory" },

	{ on = "Y", run = "back",        desc = "Back to previous directory" },
	{ on = "O", run = "forward",     desc = "Forward to next directory" },

	{ on = "I", run = "seek -5",     desc = "Seek up 5 units in the preview" },
	{ on = "N", run = "seek 5",      desc = "Seek down 5 units in the preview" },

	# Disable shadowed defaults so they don't fire accidentally.
	{ on = "h", run = "paste",          desc = "Paste files" },
	{ on = "H", run = "paste --force",  desc = "Paste files (overwrite)" },
	{ on = "j", run = "noop", desc = "" },
	{ on = "k", run = "noop", desc = "" },
	{ on = "l", run = "noop", desc = "" },
	{ on = "L", run = "noop", desc = "" },
	{ on = "J", run = "noop", desc = "" },
	{ on = "K", run = "noop", desc = "" },

	# ── Reassigned actions (moved off Norman nav keys) ──

	# yank (was y/Y) → j/J  (norman: j occupies QWERTY y position)
	{ on = "j", run = "yank",   desc = "Yank selected files (copy)" },
	{ on = "J", run = "unyank", desc = "Cancel the yank status" },

	# open (was o/O) → l/L  (norman: l occupies QWERTY o position)
	{ on = "l", run = "open",               desc = "Open selected files" },
	{ on = "L", run = "open --interactive",  desc = "Open selected files interactively" },

	# find_arrow (was n/N) → p/P  (norman: p occupies QWERTY n position)
	{ on = "p", run = "find_arrow",              desc = "Next found" },
	{ on = "P", run = "find_arrow --previous",   desc = "Previous found" },

	# rename (was r) → f  (norman: f occupies QWERTY r position)
	{ on = "f", run = "rename --cursor=before_ext", desc = "Rename selected file(s)" },

	# filter (was f) → t  (norman: t occupies QWERTY f position)
	{ on = "t", run = "filter --smart", desc = "Filter files" },

	# Disable the old single-key defaults that moved.
	{ on = "r", run = "noop", desc = "" },

	# ── Goto: translate h → y ──
	{ on = [ "g", "y" ], run = "cd ~",         desc = "Go home" },
	{ on = [ "g", "h" ], run = "noop",         desc = "" },

	# ── Tabs: t is now filter, move tabs to k prefix (norman k = QWERTY t) ──
	{ on = [ "k", "k" ], run = "tab_create --current",    desc = "Create a new tab in CWD" },
	{ on = [ "k", "f" ], run = "tab_rename --interactive", desc = "Rename current tab" },
	{ on = [ "t", "t" ], run = "noop", desc = "" },
	{ on = [ "t", "r" ], run = "noop", desc = "" },
]

# ── [spot] ─────────────────────────────────────────────────────────────

[spot]

prepend_keymap = [
	{ on = "i", run = "arrow prev", desc = "Previous line" },
	{ on = "n", run = "arrow next", desc = "Next line" },
	{ on = "y", run = "swipe prev", desc = "Swipe to previous file" },
	{ on = "o", run = "swipe next", desc = "Swipe to next file" },

	{ on = "h", run = "noop", desc = "" },
	{ on = "j", run = "noop", desc = "" },
	{ on = "k", run = "noop", desc = "" },
	{ on = "l", run = "noop", desc = "" },
]

# ── [tasks] ────────────────────────────────────────────────────────────

[tasks]

prepend_keymap = [
	{ on = "i", run = "arrow prev", desc = "Previous task" },
	{ on = "n", run = "arrow next", desc = "Next task" },

	{ on = "j", run = "noop", desc = "" },
	{ on = "k", run = "noop", desc = "" },
]

# ── [pick] ─────────────────────────────────────────────────────────────

[pick]

prepend_keymap = [
	{ on = "i", run = "arrow prev", desc = "Previous option" },
	{ on = "n", run = "arrow next", desc = "Next option" },

	{ on = "j", run = "noop", desc = "" },
	{ on = "k", run = "noop", desc = "" },
]

# ── [input] ────────────────────────────────────────────────────────────
# Input has vim-like normal/insert/visual modes. Translate hjkl navigation
# and the motions that land on Norman nav keys.

[input]

prepend_keymap = [
	# ── Navigation (hjkl → ynio) ──
	{ on = "y", run = "move -1", desc = "Move back a character" },
	{ on = "o", run = "move 1",  desc = "Move forward a character" },

	{ on = "h", run = "noop", desc = "" },
	{ on = "l", run = "noop", desc = "" },

	# ── Mode keys ──
	# insert (was i/I) → r/R  (norman: r occupies QWERTY i position)
	{ on = "r", run = "insert",                        desc = "Enter insert mode" },
	{ on = "R", run = [ "move first-char", "insert" ], desc = "Move to the BOL, and enter insert mode" },

	{ on = "i", run = "noop", desc = "" },
	{ on = "I", run = "noop", desc = "" },

	# replace (was r) → f  (norman: f occupies QWERTY r position)
	{ on = "f", run = "replace", desc = "Replace a single character" },

	# word end (was e/E) → d/D  (norman: d occupies QWERTY e position)
	{ on = "d",  run = "forward --end-of-word",       desc = "Move forward to the end of the current or next word" },
	{ on = "D",  run = "forward --far --end-of-word",  desc = "Move forward to the end of the current or next WORD" },

	# delete/cut (was d/D) → e/E  (norman: e occupies QWERTY d position)
	{ on = "e",  run = "delete --cut",                 desc = "Cut selected characters" },
	{ on = "E",  run = [ "delete --cut", "move eol" ], desc = "Cut until EOL" },

	# yank (was y) → j  (norman: j occupies QWERTY y position)
	{ on = "j", run = "yank", desc = "Copy selected characters" },

	# paste (was p/P) stays — p/P are find_arrow in mgr but paste in input, no conflict

	# undo (was u) stays — not conflicting
]

# ── [confirm] ──────────────────────────────────────────────────────────
# y/n here mean yes/no (semantic), keep them. Only translate j/k navigation.

[confirm]

prepend_keymap = [
	{ on = "i", run = "arrow prev", desc = "Previous line" },
	{ on = "n", run = "arrow next", desc = "Next line" },

	# n is now navigation, so reassign "cancel" (was n) to keep Enter/Esc/y as
	# the confirm interface. Disable bare n for cancel since it's navigation.
	# The user can still cancel with Esc or C-c.

	{ on = "j", run = "noop", desc = "" },
	{ on = "k", run = "noop", desc = "" },
]

# ── [cmp] ──────────────────────────────────────────────────────────────

[cmp]

prepend_keymap = [
	{ on = "<A-i>", run = "arrow prev", desc = "Previous item" },
	{ on = "<A-n>", run = "arrow next", desc = "Next item" },

	{ on = "<A-k>", run = "noop", desc = "" },
	{ on = "<A-j>", run = "noop", desc = "" },
]

# ── [help] ─────────────────────────────────────────────────────────────

[help]

prepend_keymap = [
	{ on = "i", run = "arrow prev", desc = "Previous line" },
	{ on = "n", run = "arrow next", desc = "Next line" },

	# filter (was f) → t  (norman: t occupies QWERTY f position)
	{ on = "t", run = "filter", desc = "Filter help items" },

	{ on = "j", run = "noop", desc = "" },
	{ on = "k", run = "noop", desc = "" },
	{ on = "f", run = "noop", desc = "" },
]
